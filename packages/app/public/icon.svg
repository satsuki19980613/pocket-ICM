<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Black Ops ICM のブランドマーク＝ログイン画面のロゴ（.auth .logo）と同一意匠。
       面取り（CP2077 プレート／辺の 15.6%）した黄の板に、◢◤ が作る平行四辺形を
       インク色で抜いた形。フォント依存を避けるためグリフではなくパスで描く。 -->
  <rect width="512" height="512" rx="112" fill="#0c0d0a"/>
  <!-- 面取りプレート（左下・右上をカット） -->
  <path d="M64 64 H388 L448 124 V448 H124 L64 388 Z" fill="#fcee0a"/>
  <!-- ◢◤ の合成＝右上がりの平行四辺形（実測: 幅=板の88%, 高=43.75%, 傾き45°） -->
  <path d="M87 340 L256 172 H425 L256 340 Z" fill="#1a1900"/>
</svg>
